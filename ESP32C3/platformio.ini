; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:lolin_c3_mini]
platform = espressif32
board = lolin_c3_mini
framework = arduino

;libraries we need for the project
lib_deps = 
    sensirion/Sensirion Core
    sensirion/Sensirion I2C SCD4x
    sensirion/Sensirion I2C SGP41
    Sensirion/Sensirion Gas Index Algorithm 
    ropg/ezTime ; for clock 
    ArduinoJson

monitor_speed = 115200

;pass custom options to compiler 
build_flags = 
    -DARDUINO_USB_MODE=1 ;use chip's native usb mode
    -DARDUINO_USB_CDC_ON_BOOT=1 ;start usb cdc on boot






