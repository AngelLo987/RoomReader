services:
  roomreader-api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${ROOMREADER_PORT:-8000}:8000"
    restart: unless-stopped
    init: true
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    security_opt:
      - no-new-privileges:true
